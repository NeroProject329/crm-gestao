packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

allowBuilds:
  '@prisma/engines': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1099.0'
  - '@aws-sdk/s3-request-presigner@3.1099.0'
