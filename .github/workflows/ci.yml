name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_ENV: test
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  quality:
    name: Quality Gate

    runs-on: ubuntu-latest

    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Typecheck monorepo
        run: pnpm typecheck

      - name: Run unit and security tests
        run: pnpm test

      - name: Run API E2E tests
        run: pnpm test:e2e

      - name: Build monorepo
        run: pnpm build

  migrations:
    name: Migration Gate

    runs-on: ubuntu-latest

    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci_password
          POSTGRES_DB: crm_ci

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U crm -d crm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://crm:crm_ci_password@127.0.0.1:5432/crm_ci
      APP_TIMEZONE: America/Sao_Paulo
      SEED_COMPANY_NAME: CRM CI
      SEED_COMPANY_SLUG: crm-gestao
      SEED_ADMIN_NAME: Administrador CI
      SEED_ADMIN_EMAIL: ci-admin@example.test
      SEED_ADMIN_PASSWORD: ci-only-password-12345

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply migrations to clean PostgreSQL
        run: pnpm db:migrate:deploy

      - name: Seed CI database
        run: pnpm db:seed

      - name: Verify tables and constraints
        run: pnpm db:verify